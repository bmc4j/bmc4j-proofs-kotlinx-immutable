name: bmc4j proofs

# Runs the @BmcProof suite on every PR and posts a proof-results report as a PR comment —
# mirroring bmc4j's own CI report (verified / refuted / unknown per proof + a tally). Self-contained
# for now; once bmc4j ships a reusable proof-report workflow this can `uses:` it instead.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  prove:
    name: prove
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Run every @BmcProof (each is a JUnit 5 test). Capture the bmc4j progress/summary output and
      # don't fail the step yet — we post the report first, then fail the job below if any proof did.
      - name: Run proofs
        run: |
          set -o pipefail
          if ./gradlew test --console=plain 2>&1 | tee proof-output.txt; then
            echo "PROOFS_OK=1" >> "$GITHUB_ENV"
          else
            echo "PROOFS_OK=0" >> "$GITHUB_ENV"
          fi

      - name: Report proof results
        if: ${{ always() }}
        uses: actions/github-script@v7
        with:
          # Parse the JUnit XML (not stdout) so the report can show each refuted proof's
          # COUNTEREXAMPLE, not just its verdict. A passing testcase is VERIFIED; a failing one
          # carries the bmc4j exception type (BmcVerificationError -> REFUTED, BmcUndecidedError ->
          # UNKNOWN) and a failure message whose "counterexample: ..." line is the witness JBMC found.
          script: |
            const fs = require('fs'), path = require('path');
            const dir = 'build/test-results/test';
            const files = fs.existsSync(dir) ? fs.readdirSync(dir).filter(f => f.endsWith('.xml')) : [];
            const dec = s => s.replace(/&#10;/g, '\n').replace(/&#13;/g, '').replace(/&quot;/g, '"')
              .replace(/&apos;/g, "'").replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
            const results = [];
            for (const f of files) {
              const xml = fs.readFileSync(path.join(dir, f), 'utf8');
              const cases = xml.match(/<testcase\b[\s\S]*?(?:\/>|<\/testcase>)/g) || [];
              for (const c of cases) {
                const name = (c.match(/\bname="([^"]*)"/) || [])[1] || '?';
                const cls = (c.match(/\bclassname="([^"]*)"/) || [])[1] || '';
                const simple = cls.split('.').pop();
                const fail = c.match(/<failure\b[^>]*\btype="([^"]*)"[\s\S]*?<\/failure>/);
                if (!fail) { results.push({ name, cls: simple, verdict: 'VERIFIED' }); continue; }
                const verdict = fail[1].includes('BmcUndecidedError') ? 'UNKNOWN' : 'REFUTED';
                const msg = dec(fail[0]);
                const ce = (msg.match(/counterexample:\s*(.+)/) || [])[1];
                results.push({ name, cls: simple, verdict, detail: ce ? ce.trim() : '' });
              }
            }
            const order = { REFUTED: 0, UNKNOWN: 1, VERIFIED: 2 };
            results.sort((a, b) => (order[a.verdict] - order[b.verdict]) || a.name.localeCompare(b.name));
            const emoji = { VERIFIED: '✅', REFUTED: '❌', UNKNOWN: '⚠️' };
            const n = results.length;
            const c = v => results.filter(r => r.verdict === v).length;
            const tally = n
              ? `${n} proofs → ${c('VERIFIED')} verified, ${c('REFUTED')} refuted, ${c('UNKNOWN')} unknown`
              : '(no proofs ran)';
            const rows = results.map(r =>
              `| \`${r.cls}.${r.name}\` | ${emoji[r.verdict]} ${r.verdict} | ${r.detail ? '`' + r.detail + '`' : ''} |`);
            const marker = '<!-- bmc4j-proof-report -->';
            const body = [
              marker, '## bmc4j proof results', '', '`' + tally + '`', '',
              n ? ['| Proof | Verdict | Counterexample |', '|---|---|---|', ...rows].join('\n') : '_No proofs ran._',
            ].join('\n');
            await core.summary.addRaw(body).write();
            if (context.eventName === 'pull_request') {
              const { owner, repo } = context.repo;
              const issue_number = context.payload.pull_request.number;
              const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
              const existing = comments.find(c => c.body && c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            }

      - name: Fail if any proof did not verify
        if: ${{ env.PROOFS_OK != '1' }}
        run: |
          echo "::error::One or more proofs did not verify — see the proof-results report."
          exit 1
